<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Advertisement | Class Finance</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #0b1120;
            color: #f8fafc;
        }

        .page {
            min-height: 100vh;
            padding: 30px 18px 50px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
        }

        .brand {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.4px;
        }

        .brand span {
            color: #60a5fa;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 14px;
            border: 1px solid #263247;
            border-radius: 10px;
            color: #cbd5e1;
            text-decoration: none;
            background: #111827;
        }

        .header {
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 30px;
            letter-spacing: -0.7px;
        }

        .header p {
            margin: 0;
            color: #94a3b8;
            line-height: 1.6;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            font-weight: 700;
            color: #cbd5e1;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid #334155;
            border-radius: 10px;
            background: #0f172a;
            color: #f8fafc;
            padding: 12px 13px;
            font: inherit;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.12);
        }

        textarea {
            min-height: 180px;
            resize: vertical;
            line-height: 1.6;
        }

        .current-image {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid #334155;
            margin-bottom: 8px;
        }

        .hint {
            font-size: 12px;
            color: #64748b;
        }

        .divider {
            height: 1px;
            background: #1f2937;
            margin: 24px 0;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 10px 17px;
            border-radius: 10px;
            border: 1px solid transparent;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-secondary {
            background: #1e293b;
            border-color: #334155;
            color: #cbd5e1;
        }

        .btn-primary {
            background: #2563eb;
            color: #ffffff;
        }

        @media (max-width: 650px) {

            .page {
                padding: 20px 12px 40px;
            }

            .topbar {
                align-items: flex-start;
            }

            .header h1 {
                font-size: 25px;
            }

            .card {
                padding: 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .actions {
                flex-direction: column-reverse;
            }

            .btn {
                width: 100%;
            }

        }

    </style>

</head>

<body>

<div class="page">

    <div class="container">

        <div class="topbar">

            <div class="brand">
                Class <span>Finance</span>
            </div>

            <a
                href="{{ url_for('admin_communications') }}"
                class="back-link"
            >
                ← Communications
            </a>

        </div>


        <div class="header">

            <h1>
                ✏️ Edit Advertisement
            </h1>

            <p>
                Update the advertisement or opportunity displayed to your class.
            </p>

        </div>


        <div class="card">

            <form
                method="POST"
                enctype="multipart/form-data"
                action="{{ url_for(
                    'edit_advertisement',
                    advertisement_id=advertisement.id
                ) }}"
            >

                <div class="form-grid">


                    {% if advertisement.image_url %}

                    <div class="field full">

                        <label>
                            Current Advertisement Image
                        </label>

                        <img
                            src="{{ advertisement.image_url }}"
                            alt="{{ advertisement.title }}"
                            class="current-image"
                        >

                        <div class="hint">
                            Upload a new image below only if you want to replace the current one.
                        </div>

                    </div>

                    {% endif %}


                    <div class="field full">

                        <label for="advertisement_image">
                            Replace Advertisement Image
                        </label>

                        <input
                            type="file"
                            id="advertisement_image"
                            name="advertisement_image"
                            accept=".jpg,.jpeg,.png,.webp"
                        >

                    </div>


                    <div class="field full">

                        <label for="title">
                            Advertisement Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            name="title"
                            value="{{ advertisement.title }}"
                            required
                        >

                    </div>


                    <div class="field full">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            name="description"
                        >{{ advertisement.description or '' }}</textarea>

                    </div>


                    <div class="field full">

                        <label for="target_url">
                            Target URL
                        </label>

                        <input
                            type="url"
                            id="target_url"
                            name="target_url"
                            value="{{ advertisement.target_url or '' }}"
                            placeholder="https://example.com"
                        >

                    </div>


                    <div class="field">

                        <label for="start_date">
                            Start Date
                        </label>

                        <input
                            type="date"
                            id="start_date"
                            name="start_date"
                            value="{{ advertisement.start_date or '' }}"
                        >

                    </div>


                    <div class="field">

                        <label for="end_date">
                            End Date
                        </label>

                        <input
                            type="date"
                            id="end_date"
                            name="end_date"
                            value="{{ advertisement.end_date or '' }}"
                        >

                    </div>


                    <div class="field">

                        <label for="status">
                            Status
                        </label>

                        <select
                            id="status"
                            name="status"
                        >

                            <option
                                value="Active"
                                {% if advertisement.status == "Active" %}
                                selected
                                {% endif %}
                            >
                                Active
                            </option>

                            <option
                                value="Inactive"
                                {% if advertisement.status == "Inactive" %}
                                selected
                                {% endif %}
                            >
                                Inactive
                            </option>

                        </select>

                    </div>


                    <div class="field">

                        <label for="priority">
                            Priority
                        </label>

                        <input
                            type="number"
                            id="priority"
                            name="priority"
                            value="{{ advertisement.priority }}"
                        >

                    </div>

                </div>


                <div class="divider"></div>


                <div class="actions">

                    <a
                        href="{{ url_for('admin_communications') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        💾 Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
